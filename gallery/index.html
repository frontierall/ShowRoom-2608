<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수업용 결과물 갤러리</title>

  <!-- 갤러리 UI 스타일. 예제 파일의 스타일과는 완전히 분리되어 있습니다.
       (예제는 iframe 안에서 실행되므로 서로 CSS가 섞이지 않습니다.) -->
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <!-- ============================================================
       [1층] 상단 가로 탭 - 갤러리 전환
       홈페이지 / UX·UI 메뉴 / 디자인
       버튼은 app.js 가 데이터(GALLERY_DATA)를 보고 만들어 넣습니다.
       ============================================================ -->
  <header class="topbar">
    <div class="topbar__inner">
      <h1 class="topbar__title">수업용 결과물 갤러리</h1>
      <nav class="tabs" id="galleryTabs" aria-label="갤러리 선택"></nav>
    </div>
  </header>

  <!-- ============================================================
       [2층 + 3층] 좌측 사이드바(분류 필터) + 카드 그리드
       ============================================================ -->
  <main class="layout">

    <!-- [2층] 분류 필터.
         "페이지 이동"이 아니라 "필터"라는 점이 드러나도록
         제목에 안내 문구를 넣고, 선택된 항목에 체크 표시를 붙입니다.
         화면 폭 900px 이하에서는 CSS가 이 영역을 상단 가로 칩 줄로 바꿉니다. -->
    <aside class="sidebar" aria-label="분류 필터">
      <p class="sidebar__label">분류 필터</p>
      <ul class="filters" id="groupFilters"></ul>
    </aside>

    <!-- [3층] 카드 그리드 -->
    <section class="content">
      <!-- 현재 필터 상태를 한 줄로 알려주는 영역 -->
      <p class="content__status" id="resultStatus"></p>

      <!-- 카드들이 들어갈 자리. app.js 가 채웁니다. -->
      <div class="grid" id="cardGrid"></div>

      <!-- 데이터가 없는 갤러리(홈페이지/디자인)를 골랐을 때 보여줄 안내 -->
      <div class="empty" id="emptyState" hidden>
        <p class="empty__title">아직 등록된 예제가 없습니다.</p>
        <p class="empty__desc">이 갤러리는 준비 중입니다. 상단 탭에서 <b>UX·UI 메뉴</b>를 선택해 주세요.</p>
      </div>
    </section>
  </main>

  <!-- ============================================================
       상세 오버레이 모달
       평소에는 hidden 속성으로 숨겨두고, 카드를 클릭하면 app.js 가
       내용을 채운 뒤 hidden 을 제거해 보여줍니다.
       ============================================================ -->
  <div class="modal" id="modal" hidden>
    <!-- 배경(딤). 이 영역을 클릭하면 모달이 닫힙니다. -->
    <div class="modal__backdrop" data-close="1"></div>

    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

      <!-- 모달 상단: 제목 + 닫기 버튼 -->
      <div class="modal__head">
        <h2 class="modal__title" id="modalTitle"></h2>
        <button class="iconbtn" type="button" id="modalClose" aria-label="닫기">&times;</button>
      </div>

      <!-- 폭 전환 세그먼티드 컨트롤.
           누르면 아래 미리보기 컨테이너의 "폭"만 바뀝니다.
           예제 안의 CSS 미디어쿼리가 실제로 반응하는지 확인하는 용도입니다. -->
      <div class="modal__tools">
        <div class="segmented" id="widthSwitch" role="group" aria-label="미리보기 폭">
          <button type="button" data-width="desktop">데스크톱</button>
          <button type="button" data-width="tablet">태블릿 768px</button>
          <button type="button" data-width="mobile">모바일 390px</button>
        </div>
        <!-- 예제 파일을 브라우저 새 탭에서 그대로 열어보는 링크 -->
        <a class="newtab" id="modalOpenNew" href="#" target="_blank" rel="noopener">새 창에서 열기 ↗</a>
      </div>

      <!-- 미리보기 무대.
           예제가 "갤러리 UI"가 아니라 "하나의 웹사이트"임을 보여주기 위해
           반드시 브라우저 창 모양 프레임(.browser) 안에 넣습니다. -->
      <div class="stage">
        <div class="browser" id="previewFrame">
          <!-- 창 상단 바: 신호등 점 3개 + 주소 표시줄 -->
          <div class="browser__bar">
            <span class="dot dot--red"></span>
            <span class="dot dot--yellow"></span>
            <span class="dot dot--green"></span>
            <span class="browser__url" id="previewUrl"></span>
          </div>
          <!-- 실제 예제가 실행되는 곳 -->
          <div class="browser__body">
            <iframe id="previewIframe" title="예제 미리보기"></iframe>
          </div>
        </div>
      </div>

      <!-- 하단 접이식 설명 패널.
           <details>/<summary> 는 브라우저가 기본으로 접기/펼치기를 해 주는 태그라
           JS 없이도 동작합니다. -->
      <details class="notes" id="modalNotes" open>
        <summary class="notes__summary">언제 쓰나 · 장점 · 단점</summary>
        <div class="notes__body">
          <section class="note">
            <h3 class="note__title">언제 쓰나</h3>
            <p class="note__when" id="noteWhen"></p>
          </section>
          <section class="note">
            <h3 class="note__title">장점</h3>
            <ul class="note__list" id="notePros"></ul>
          </section>
          <section class="note">
            <h3 class="note__title">단점</h3>
            <ul class="note__list" id="noteCons"></ul>
          </section>
        </div>
      </details>

    </div>
  </div>

  <!-- 데이터를 먼저 읽고(app.js 가 window.GALLERY_DATA 를 사용하므로),
       그다음 화면을 그리는 스크립트를 불러옵니다. 순서가 바뀌면 안 됩니다. -->
  <script src="data/examples.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
