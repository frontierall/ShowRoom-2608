<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>01. 상단 가로 탭</title>

<!-- ============================================================
     [01] 상단 가로 탭 (Top Horizontal Tabs)

     메뉴를 화면 맨 위에 가로로 나란히 놓는 가장 기본적인 형태입니다.
     메뉴가 4개 안팎일 때 가장 잘 맞습니다.

     핵심 아이디어
     - 메뉴 버튼: display:flex 로 가로 배치
     - 선택 표시: 아래쪽 밑줄(border-bottom)
     - 화면 전환: 실제 페이지 이동 대신 패널을 보였다/숨겼다 함
     ============================================================ -->

<style>
  /* ---------- 공통 기초 ---------- */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f6f7f9;
    color: #1f2430;
    font-size: 14px;
  }

  /* ---------- 헤더 (로고 + 탭) ---------- */
  .header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }

  .header__top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px 0;
  }

  .logo {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -.3px;
  }

  /* 오른쪽 끝으로 밀어내기: margin-left:auto 가 남은 공간을 다 먹습니다 */
  .avatar {
    margin-left: auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #3b5bdb;
    color: #fff;
    display: grid;
    place-items: center;   /* 가로/세로 동시 가운데 정렬 */
    font-size: 12px;
    font-weight: 700;
  }

  /* ---------- 핵심: 가로 탭 줄 ---------- */
  .tabs {
    display: flex;         /* 자식(button)들을 가로로 나열 */
    gap: 4px;
    padding: 10px 24px 0;
  }

  .tab {
    padding: 10px 16px;
    border: 0;
    background: transparent;
    font: inherit;
    color: #6b7280;
    cursor: pointer;
    /* 선택 밑줄이 나중에 생겨도 높이가 흔들리지 않도록
       평소에도 투명한 밑줄을 미리 깔아 둡니다. */
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;   /* 헤더 아래 경계선과 겹치게 */
  }

  .tab:hover { color: #1f2430; }

  /* 지금 선택된 탭 */
  .tab.is-active {
    color: #1f2430;
    font-weight: 700;
    border-bottom-color: #3b5bdb;
  }

  /* ---------- 본문 ---------- */
  .main { padding: 22px 24px 40px; }

  .page-title {
    margin: 0 0 16px;
    font-size: 18px;
    font-weight: 700;
  }

  /* 숫자 카드 4개 */
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .kpi {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px 16px;
  }

  .kpi__label { font-size: 12px; color: #6b7280; }
  .kpi__value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .kpi__delta { font-size: 12px; color: #2f9e44; }
  .kpi__delta.is-down { color: #e03131; }

  /* 표 */
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
  }

  .card__head {
    padding: 12px 16px;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 700;
  }

  table { width: 100%; border-collapse: collapse; }

  th, td {
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid #f1f3f5;
    font-size: 13px;
  }

  th { color: #6b7280; font-weight: 600; background: #fafbfc; }
  tr:last-child td { border-bottom: 0; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    background: #e7f5ff;
    color: #1971c2;
  }

  .badge--done { background: #ebfbee; color: #2f9e44; }
  .badge--wait { background: #fff4e6; color: #e8590c; }

  /* 탭으로 전환되는 패널들. 기본은 숨김. */
  .panel { display: none; }
  .panel.is-on { display: block; }

  .placeholder {
    background: #fff;
    border: 1px dashed #d0d5dd;
    border-radius: 10px;
    padding: 40px;
    text-align: center;
    color: #6b7280;
  }

  /* ---------- 반응형: 좁아지면 KPI를 2열로 ---------- */
  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .tabs { overflow-x: auto; }   /* 탭이 넘치면 좌우 스크롤 */
  }
</style>
</head>
<body>

  <header class="header">
    <div class="header__top">
      <span class="logo">Nova Admin</span>
      <span class="avatar">JW</span>
    </div>

    <!-- 메뉴 4개. data-target 값으로 어떤 패널을 보여줄지 연결합니다. -->
    <nav class="tabs">
      <button class="tab is-active" data-target="dashboard">대시보드</button>
      <button class="tab" data-target="orders">주문</button>
      <button class="tab" data-target="customers">고객</button>
      <button class="tab" data-target="settings">설정</button>
    </nav>
  </header>

  <main class="main">

    <!-- 패널 1: 대시보드 -->
    <section class="panel is-on" id="dashboard">
      <h1 class="page-title">대시보드</h1>

      <div class="kpis">
        <div class="kpi">
          <div class="kpi__label">오늘 매출</div>
          <div class="kpi__value">₩4,820,000</div>
          <div class="kpi__delta">+12.4%</div>
        </div>
        <div class="kpi">
          <div class="kpi__label">신규 주문</div>
          <div class="kpi__value">128</div>
          <div class="kpi__delta">+8.1%</div>
        </div>
        <div class="kpi">
          <div class="kpi__label">방문자</div>
          <div class="kpi__value">3,412</div>
          <div class="kpi__delta is-down">-2.3%</div>
        </div>
        <div class="kpi">
          <div class="kpi__label">환불 요청</div>
          <div class="kpi__value">6</div>
          <div class="kpi__delta is-down">+1건</div>
        </div>
      </div>

      <div class="card">
        <div class="card__head">최근 주문</div>
        <table>
          <thead>
            <tr><th>주문번호</th><th>고객</th><th>금액</th><th>상태</th></tr>
          </thead>
          <tbody>
            <tr><td>#20418</td><td>김서연</td><td>₩128,000</td><td><span class="badge badge--done">배송완료</span></td></tr>
            <tr><td>#20417</td><td>이준호</td><td>₩64,500</td><td><span class="badge">배송중</span></td></tr>
            <tr><td>#20416</td><td>박다은</td><td>₩212,000</td><td><span class="badge badge--wait">결제대기</span></td></tr>
            <tr><td>#20415</td><td>최민수</td><td>₩39,900</td><td><span class="badge badge--done">배송완료</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 패널 2~4: 내용은 자리표시자로 간단히 -->
    <section class="panel" id="orders">
      <h1 class="page-title">주문</h1>
      <div class="placeholder">주문 목록 화면이 들어갈 자리입니다.</div>
    </section>

    <section class="panel" id="customers">
      <h1 class="page-title">고객</h1>
      <div class="placeholder">고객 목록 화면이 들어갈 자리입니다.</div>
    </section>

    <section class="panel" id="settings">
      <h1 class="page-title">설정</h1>
      <div class="placeholder">설정 화면이 들어갈 자리입니다.</div>
    </section>

  </main>

<script>
  /* ------------------------------------------------------------
     탭 전환 스크립트

     각 버튼마다 이벤트를 따로 붙이지 않고, 부모 <nav> 에 한 번만
     붙여서 클릭이 올라오는 것을 받습니다. (이벤트 위임)
     ------------------------------------------------------------ */
  var nav = document.querySelector('.tabs');

  nav.addEventListener('click', function (e) {
    // 클릭된 지점에서 위로 올라가며 가장 가까운 .tab 을 찾습니다.
    var btn = e.target.closest('.tab');
    if (!btn) return;   // 탭이 아닌 빈 곳을 눌렀으면 무시

    // 1) 모든 탭의 선택 표시를 끄고, 누른 탭만 켭니다.
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.remove('is-active');
    });
    btn.classList.add('is-active');

    // 2) 모든 패널을 숨기고, 연결된 패널만 보여줍니다.
    document.querySelectorAll('.panel').forEach(function (p) {
      p.classList.remove('is-on');
    });
    document.getElementById(btn.dataset.target).classList.add('is-on');
  });
</script>
</body>
</html>
