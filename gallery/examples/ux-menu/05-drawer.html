<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>05. 햄버거 드로어</title>

<!-- ============================================================
     [05] 햄버거 드로어 (Hamburger Drawer)

     모바일 폭 기준 예제입니다.
     평소에는 메뉴를 화면 밖에 숨겨 두고, 햄버거 버튼(≡)을 누르면
     왼쪽에서 밀려 나옵니다.

     핵심 아이디어
     - 드로어는 position:fixed 로 화면 왼쪽에 붙여 두고
       transform: translateX(-100%) 로 화면 밖에 대기시킵니다.
     - 열 때는 translateX(0) 으로 되돌립니다.
       (left 값을 바꾸는 것보다 transform 이 애니메이션 성능이 좋습니다.)
     - 드로어 뒤에는 반투명 배경(딤)을 깔아 바깥을 눌러도 닫히게 합니다.
     ============================================================ -->

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f6f7f9;
    color: #1f2430;
    font-size: 14px;
  }

  /* 드로어가 열려 있는 동안 뒤 화면이 스크롤되지 않게 잠급니다. */
  body.is-locked { overflow: hidden; }

  /* ---------- 상단 앱바 ---------- */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 12px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }

  /* 햄버거 버튼: 가로 막대 3개를 div 로 그립니다. */
  .hamburger {
    width: 36px; height: 36px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-content: center;
    gap: 4px;
  }

  .hamburger:hover { background: #f1f3f5; }

  .hamburger span {
    display: block;
    width: 18px;
    height: 2px;
    background: #1f2430;
    border-radius: 2px;
  }

  .appbar__title { font-weight: 700; font-size: 15px; }

  .appbar__action {
    margin-left: auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #e7f5ff;
    color: #1971c2;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
  }

  /* ---------- 드로어 ---------- */
  /* 딤(뒷배경). 평소에는 투명 + 클릭 불가 상태로 숨겨 둡니다. */
  .dim {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .45);
    opacity: 0;
    pointer-events: none;          /* 안 보일 때는 클릭도 통과시킴 */
    transition: opacity .22s ease;
    z-index: 20;
  }

  .dim.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  /* 드로어 본체. 화면 왼쪽 밖(-100%)에 대기하다가 0 으로 들어옵니다. */
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 264px;
    max-width: 82vw;               /* 아주 좁은 폰에서도 본문이 조금 보이게 */
    background: #fff;
    z-index: 30;
    transform: translateX(-100%);
    transition: transform .24s ease;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 16px rgba(0,0,0,.14);
  }

  .drawer.is-open { transform: translateX(0); }

  .drawer__head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 14px;
    border-bottom: 1px solid #f1f3f5;
  }

  .drawer__avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #1971c2; color: #fff;
    display: grid; place-items: center;
    font-weight: 700;
  }

  .drawer__name { font-weight: 700; }
  .drawer__mail { font-size: 12px; color: #98a2b3; }

  .drawer__close {
    margin-left: auto;
    width: 30px; height: 30px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font-size: 18px;
    color: #98a2b3;
    cursor: pointer;
  }

  .drawer__close:hover { background: #f1f3f5; color: #1f2430; }

  .drawer__menu {
    list-style: none;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
    flex: 1;
  }

  .drawer__link {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 11px 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    font: inherit;
    color: #4b5563;
    text-align: left;
    cursor: pointer;
  }

  .drawer__link:hover { background: #f1f3f5; }

  .drawer__link.is-active {
    background: #e7f5ff;
    color: #1971c2;
    font-weight: 700;
  }

  .drawer__icon { width: 18px; text-align: center; }

  .drawer__foot {
    padding: 12px 16px;
    border-top: 1px solid #f1f3f5;
    font-size: 12px;
    color: #98a2b3;
  }

  /* ---------- 본문 ---------- */
  .main { padding: 16px 14px 32px; }

  .hero {
    background: #1971c2;
    color: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
  }

  .hero__label { font-size: 12px; opacity: .8; }
  .hero__value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .hero__sub   { font-size: 12px; opacity: .85; margin-top: 4px; }

  .kpis {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .kpi {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px 14px;
  }

  .kpi__label { font-size: 12px; color: #6b7280; }
  .kpi__value { font-size: 18px; font-weight: 700; margin-top: 2px; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: #6b7280;
    margin: 0 0 8px 2px;
  }

  .list {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #f1f3f5;
  }

  .row:last-child { border-bottom: 0; }

  .row__thumb {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: #edf2ff;
    display: grid; place-items: center;
    font-size: 15px;
  }

  .row__title { font-weight: 600; }
  .row__desc { font-size: 12px; color: #98a2b3; }
  .row__amount { margin-left: auto; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>

  <!-- ---------- 상단 앱바 ---------- -->
  <header class="appbar">
    <button class="hamburger" id="openBtn" aria-label="메뉴 열기">
      <span></span><span></span><span></span>
    </button>
    <span class="appbar__title">내 지갑</span>
    <span class="appbar__action">알림</span>
  </header>

  <!-- ---------- 딤(뒷배경): 누르면 닫힘 ---------- -->
  <div class="dim" id="dim"></div>

  <!-- ---------- 드로어 ---------- -->
  <nav class="drawer" id="drawer" aria-label="주 메뉴">
    <div class="drawer__head">
      <div class="drawer__avatar">JW</div>
      <div>
        <div class="drawer__name">이도경</div>
        <div class="drawer__mail">dokyung@example.com</div>
      </div>
      <button class="drawer__close" id="closeBtn" aria-label="메뉴 닫기">&times;</button>
    </div>

    <ul class="drawer__menu">
      <li><button class="drawer__link is-active"><span class="drawer__icon">▤</span>홈</button></li>
      <li><button class="drawer__link"><span class="drawer__icon">◫</span>거래 내역</button></li>
      <li><button class="drawer__link"><span class="drawer__icon">◈</span>카드 관리</button></li>
      <li><button class="drawer__link"><span class="drawer__icon">◭</span>지출 리포트</button></li>
      <li><button class="drawer__link"><span class="drawer__icon">☺</span>친구 송금</button></li>
      <li><button class="drawer__link"><span class="drawer__icon">✉</span>알림 센터</button></li>
      <li><button class="drawer__link"><span class="drawer__icon">⚙</span>설정</button></li>
    </ul>

    <div class="drawer__foot">v2.4.1 · 고객센터 1588-0000</div>
  </nav>

  <!-- ---------- 본문 ---------- -->
  <main class="main">
    <div class="hero">
      <div class="hero__label">이번 달 지출</div>
      <div class="hero__value">₩1,284,300</div>
      <div class="hero__sub">지난달보다 8% 적게 썼어요</div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="kpi__label">잔액</div><div class="kpi__value">₩412,900</div></div>
      <div class="kpi"><div class="kpi__label">예정 결제</div><div class="kpi__value">₩89,000</div></div>
    </div>

    <p class="section-title">최근 거래</p>
    <div class="list">
      <div class="row">
        <div class="row__thumb">☕</div>
        <div>
          <div class="row__title">스타 카페 성수점</div>
          <div class="row__desc">오늘 09:12</div>
        </div>
        <div class="row__amount">-5,800</div>
      </div>
      <div class="row">
        <div class="row__thumb">🚌</div>
        <div>
          <div class="row__title">대중교통</div>
          <div class="row__desc">오늘 08:40</div>
        </div>
        <div class="row__amount">-1,500</div>
      </div>
      <div class="row">
        <div class="row__thumb">🛒</div>
        <div>
          <div class="row__title">한빛마트</div>
          <div class="row__desc">어제 19:26</div>
        </div>
        <div class="row__amount">-42,300</div>
      </div>
      <div class="row">
        <div class="row__thumb">💰</div>
        <div>
          <div class="row__title">급여 입금</div>
          <div class="row__desc">8월 25일</div>
        </div>
        <div class="row__amount">+3,120,000</div>
      </div>
    </div>
  </main>

<script>
  /* ------------------------------------------------------------
     드로어 열기 / 닫기

     상태를 나타내는 방법은 클래스 하나(is-open)뿐입니다.
     - 드로어와 딤에 동시에 붙였다 뗍니다.
     - 실제 움직임(transform, opacity)은 CSS 가 담당합니다.
       JS 는 "지금 열려 있다/닫혀 있다"만 관리합니다.
     ------------------------------------------------------------ */

  var drawer = document.getElementById('drawer');
  var dim    = document.getElementById('dim');

  function openDrawer() {
    drawer.classList.add('is-open');
    dim.classList.add('is-open');
    document.body.classList.add('is-locked');   // 뒤 화면 스크롤 잠금
  }

  function closeDrawer() {
    drawer.classList.remove('is-open');
    dim.classList.remove('is-open');
    document.body.classList.remove('is-locked');
  }

  // 햄버거 버튼으로 열기
  document.getElementById('openBtn').addEventListener('click', openDrawer);

  // 닫는 방법 3가지: X 버튼 / 딤 클릭 / ESC 키
  document.getElementById('closeBtn').addEventListener('click', closeDrawer);
  dim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
  });

  // 메뉴를 고르면 선택 표시를 옮기고 드로어를 닫습니다.
  // (모바일 드로어는 "고르면 닫힌다"가 기본 동작입니다.)
  document.querySelector('.drawer__menu').addEventListener('click', function (e) {
    var link = e.target.closest('.drawer__link');
    if (!link) return;

    document.querySelectorAll('.drawer__link').forEach(function (el) {
      el.classList.remove('is-active');
    });
    link.classList.add('is-active');

    document.querySelector('.appbar__title').textContent = link.textContent.trim();
    closeDrawer();
  });
</script>
</body>
</html>
