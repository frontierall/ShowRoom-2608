<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>03. 그룹형 사이드바</title>

<!-- ============================================================
     [03] 그룹형 사이드바 (Grouped / Accordion Sidebar)

     메뉴 12개를 성격에 따라 3개 섹션으로 묶은 형태입니다.
     메뉴가 10개를 넘어가면 한 덩어리로는 읽기 힘들어지므로
     "판매 / 콘텐츠 / 시스템" 처럼 묶어 줍니다.

     핵심 아이디어
     - 섹션 제목을 누르면 그 아래 목록이 접혔다 펼쳐짐 (아코디언)
     - 접기 구현: max-height 를 0 <-> 충분히 큰 값으로 바꿔
       transition 이 걸리게 함 (height:auto 로는 애니메이션이 안 됨)
     ============================================================ -->

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f6f7f9;
    color: #1f2430;
    font-size: 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 232px 1fr;
    min-height: 100vh;
  }

  /* ---------- 사이드바 ---------- */
  .side {
    background: #fff;
    border-right: 1px solid #e5e7eb;
    padding: 16px 12px 24px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .side__logo {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 16px;
    font-weight: 700;
    font-size: 16px;
  }

  .side__mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #0b7285; color: #fff;
    display: grid; place-items: center;
    font-size: 12px;
  }

  /* ---------- 섹션 하나 ---------- */
  .group { margin-bottom: 4px; }

  /* 섹션 제목 (누르면 접기/펼치기) */
  .group__head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    color: #98a2b3;
    cursor: pointer;
    text-align: left;
  }

  .group__head:hover { color: #475467; }

  /* 화살표. 펼쳐지면 90도 회전합니다. */
  .group__arrow {
    margin-left: auto;
    font-size: 10px;
    transition: transform .18s ease;
  }

  .group.is-open .group__arrow { transform: rotate(90deg); }

  /* 접히는 목록.
     max-height 를 0 으로 두면 접히고, 넉넉한 값을 주면 펼쳐집니다.
     overflow:hidden 이 있어야 접혔을 때 내용이 삐져나오지 않습니다. */
  .group__list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height .22s ease;
  }

  .group.is-open .group__list { max-height: 320px; }

  .menu__link {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px 8px 18px;   /* 왼쪽을 더 띄워 섹션 하위임을 표시 */
    border: 0;
    border-radius: 8px;
    background: transparent;
    font: inherit;
    color: #4b5563;
    text-align: left;
    cursor: pointer;
  }

  .menu__link:hover { background: #f1f3f5; color: #1f2430; }

  .menu__link.is-active {
    background: #e3fafc;
    color: #0b7285;
    font-weight: 700;
  }

  .menu__dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #cbd5e1;
    flex: 0 0 5px;
  }

  .menu__link.is-active .menu__dot { background: #0b7285; }

  /* ---------- 본문 ---------- */
  .main { padding: 22px 26px 40px; }

  .crumbs { font-size: 12px; color: #98a2b3; margin-bottom: 6px; }
  .page-title { margin: 0 0 18px; font-size: 19px; font-weight: 700; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  .kpi {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px 16px;
  }

  .kpi__label { font-size: 12px; color: #6b7280; }
  .kpi__value { font-size: 20px; font-weight: 700; margin-top: 2px; }

  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
  }

  .card__head { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; }

  th, td {
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid #f1f3f5;
    font-size: 13px;
  }

  th { color: #6b7280; font-weight: 600; background: #fafbfc; }
  tr:last-child td { border-bottom: 0; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    background: #e3fafc;
    color: #0b7285;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; height: auto; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

  <div class="layout">

    <!-- ---------- 메뉴 12개 / 섹션 3개 ---------- -->
    <aside class="side">
      <div class="side__logo">
        <span class="side__mark">C</span>
        <span>Cargo Console</span>
      </div>

      <!-- 섹션 1: 기본으로 펼쳐진 상태(is-open) -->
      <div class="group is-open">
        <button class="group__head">
          <span>판매</span>
          <span class="group__arrow">▶</span>
        </button>
        <ul class="group__list">
          <li><button class="menu__link is-active"><span class="menu__dot"></span>주문 목록</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>배송 관리</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>반품 · 교환</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>정산</button></li>
        </ul>
      </div>

      <!-- 섹션 2 -->
      <div class="group is-open">
        <button class="group__head">
          <span>콘텐츠</span>
          <span class="group__arrow">▶</span>
        </button>
        <ul class="group__list">
          <li><button class="menu__link"><span class="menu__dot"></span>상품 등록</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>카테고리</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>기획전</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>배너 관리</button></li>
        </ul>
      </div>

      <!-- 섹션 3: 기본으로 접힌 상태 -->
      <div class="group">
        <button class="group__head">
          <span>시스템</span>
          <span class="group__arrow">▶</span>
        </button>
        <ul class="group__list">
          <li><button class="menu__link"><span class="menu__dot"></span>사용자 · 권한</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>알림 설정</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>연동 관리</button></li>
          <li><button class="menu__link"><span class="menu__dot"></span>로그 기록</button></li>
        </ul>
      </div>
    </aside>

    <!-- ---------- 본문 ---------- -->
    <main class="main">
      <p class="crumbs">판매 &nbsp;›&nbsp; 주문 목록</p>
      <h1 class="page-title">주문 목록</h1>

      <div class="kpis">
        <div class="kpi"><div class="kpi__label">결제 대기</div><div class="kpi__value">14</div></div>
        <div class="kpi"><div class="kpi__label">배송 준비</div><div class="kpi__value">57</div></div>
        <div class="kpi"><div class="kpi__label">배송 중</div><div class="kpi__value">231</div></div>
        <div class="kpi"><div class="kpi__label">반품 요청</div><div class="kpi__value">5</div></div>
      </div>

      <div class="card">
        <div class="card__head">전체 주문</div>
        <table>
          <thead>
            <tr><th>주문번호</th><th>고객</th><th>배송지</th><th>상태</th></tr>
          </thead>
          <tbody>
            <tr><td>#C-8841</td><td>정하늘</td><td>서울 마포구</td><td><span class="tag">배송 준비</span></td></tr>
            <tr><td>#C-8840</td><td>오세훈</td><td>부산 해운대구</td><td><span class="tag">배송 중</span></td></tr>
            <tr><td>#C-8839</td><td>한지민</td><td>대전 유성구</td><td><span class="tag">배송 중</span></td></tr>
            <tr><td>#C-8838</td><td>류현우</td><td>경기 성남시</td><td><span class="tag">결제 대기</span></td></tr>
            <tr><td>#C-8837</td><td>배수진</td><td>인천 연수구</td><td><span class="tag">배송 준비</span></td></tr>
          </tbody>
        </table>
      </div>
    </main>

  </div>

<script>
  /* ------------------------------------------------------------
     (1) 섹션 접기 / 펼치기
     섹션 제목(.group__head)을 누르면 부모 .group 에 붙은
     is-open 클래스를 켰다/껐다 합니다.
     실제 접히는 동작은 CSS 의 max-height 가 처리합니다.
     ------------------------------------------------------------ */
  document.querySelectorAll('.group__head').forEach(function (head) {
    head.addEventListener('click', function () {
      head.parentElement.classList.toggle('is-open');
    });
  });

  /* ------------------------------------------------------------
     (2) 메뉴 선택 표시 + 본문 제목/경로 갱신
     ------------------------------------------------------------ */
  document.querySelectorAll('.menu__link').forEach(function (link) {
    link.addEventListener('click', function () {
      document.querySelectorAll('.menu__link').forEach(function (el) {
        el.classList.remove('is-active');
      });
      link.classList.add('is-active');

      // 이 메뉴가 속한 섹션 이름을 찾아 이동 경로(breadcrumb)를 만듭니다.
      var groupName = link.closest('.group').querySelector('.group__head span').textContent;
      var itemName  = link.textContent.trim();

      document.querySelector('.crumbs').innerHTML =
        groupName + ' &nbsp;›&nbsp; ' + itemName;
      document.querySelector('.page-title').textContent = itemName;
    });
  });
</script>
</body>
</html>
