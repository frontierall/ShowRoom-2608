<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수업용 결과물 갤러리</title>

<!-- ============================================================
     레포 루트 진입점.

     GitHub Pages 는 레포 루트(또는 /docs)만 사이트 최상단으로 삼습니다.
     실제 갤러리는 gallery/ 안에 있으므로, 루트로 들어온 사람을
     그쪽으로 넘겨 주는 역할만 합니다.

     넘기는 방법을 두 겹으로 뒀습니다.
     1) <meta http-equiv="refresh"> - JS 가 꺼져 있어도 동작
     2) 아래 링크 - 자동 이동이 막혔을 때 직접 누를 수 있게
     ============================================================ -->
<meta http-equiv="refresh" content="0; url=gallery/index.html" />
<link rel="canonical" href="gallery/index.html" />

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f5f5f5;
    color: #1c1c1c;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 14px;
  }

  .box { text-align: center; line-height: 1.7; }
  .box p { margin: 0 0 10px; color: #6b6b6b; }

  .box a {
    color: #1c1c1c;
    border-bottom: 1px solid #cfcfcf;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <p>갤러리로 이동 중입니다…</p>
    <a href="gallery/index.html">자동으로 넘어가지 않으면 여기를 눌러 주세요</a>
  </div>
</body>
</html>
